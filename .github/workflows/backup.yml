name: Database Backup

on:
  schedule:
    # Запуск каждый день в 03:00 по Москве (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Позволяет запустить вручную из вкладки Actions

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # set -o pipefail гарантирует, что если pg_dump упадет с ошибкой,
          # весь шаг тоже упадёт, и мы не загрузим пустой файл.
          set -o pipefail

          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          FILENAME="backup_${TIMESTAMP}.sql.gz"

          pg_dump "$DATABASE_URL" --no-owner --no-acl | gzip > $FILENAME

          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Upload backup file to Backblaze
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          AWS_ENDPOINT_URL: https://${{ secrets.S3_ENDPOINT }}
        run: |
          aws s3 cp ${{ env.BACKUP_FILE }} s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.BACKUP_FILE }}
