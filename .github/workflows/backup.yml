name: Database Backup

on:
  schedule:
    # Запуск каждый день в 03:00 по Москве (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Позволяет запустить вручную из вкладки Actions

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          FILENAME="backup_${TIMESTAMP}.sql.gz"

          # Делаем дамп и сразу сжимаем его
          pg_dump "$DATABASE_URL" --no-owner --no-acl | gzip > $FILENAME

          # Сохраняем имя файла для следующего шага
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.S3_REGION }}
          aws-endpoint-url: https://${{ secrets.S3_ENDPOINT }}

      - name: Upload backup file to Backblaze
        run: |
          aws s3 cp ${{ env.BACKUP_FILE }} s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.BACKUP_FILE }}
