server {
    listen 80;
    # Слушаем любые входящие запросы, пришедшие через внешний прокси
    server_name _;

    # Раздача фронтенд-статики
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Важно для React (Single Page Application): перенаправляет роуты на index.html
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API во внутреннюю сеть Docker
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
